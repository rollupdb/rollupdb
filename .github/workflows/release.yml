name: release

# Builds the rollupdb binaries, checks each one, and publishes them with a
# release.
#
# Releases go out on their own. When the tests pass on a push to main and the
# version in doc.go has no tag yet, this workflow builds and checks the
# binaries from that commit, then tags it and publishes the release with the
# binaries attached. Nothing goes public unless every build and check passes.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.
# RELEASING.md has the whole procedure.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
          workflow_run)
            # Only the commit main is at now; if main has moved on, the run
            # after the next push decides.
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "No release: main has moved on from $RUN_SHA to $head."
              exit 0
            fi
            version=$(sed -n 's/^const Version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' doc.go)
            if [ -z "$version" ]; then
              echo "doc.go has no Version of the form X.Y.Z" >&2
              exit 1
            fi
            tags=$(git ls-remote --tags --refs origin) || { echo "Couldn't read the repository's tags" >&2; exit 1; }
            if grep -q "refs/tags/v$version\$" <<< "$tags"; then
              echo "No release: v$version is out already."
              exit 0
            fi
            newest=$({ grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' <<< "$tags" || true; } | sed 's|refs/tags/v||' | sort -V | tail -n 1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "v$version is older than the newest release, v$newest; raise the version above it" >&2
              exit 1
            fi
            echo "Releasing v$version from $RUN_SHA."
            { echo "tag=v$version"; echo "ref=$RUN_SHA"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            ;;
          release)
            { echo "tag=$RELEASE_TAG"; echo "ref=$RELEASE_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          esac

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, smoke: true }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, smoke: true }
          - { runner: macos-latest, goos: darwin, goarch: arm64, smoke: true }
          - { runner: macos-latest, goos: darwin, goarch: amd64, smoke: false }
          - { runner: windows-latest, goos: windows, goarch: amd64, smoke: true }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - name: Build
        run: |
          exe=rollupdb
          if [ "$GOOS" = windows ]; then exe=rollupdb.exe; fi
          go build -trimpath -ldflags '-s -w' -o "$exe" ./cmd/rollupdb
          echo "EXE=$exe" >> "$GITHUB_ENV"
      - name: Smoke test
        if: matrix.smoke
        run: sh scripts/smoke.sh "./$EXE"
      - name: Package
        run: |
          name=rollupdb_${GOOS}_${GOARCH}
          mkdir pkg
          cp "$EXE" LICENSE NOTICE README.md pkg/
          bash scripts/third-party-licenses.sh > pkg/THIRD_PARTY_LICENSES.md
          if [ "$GOOS" = windows ]; then
            (cd pkg && 7z a -tzip -bso0 "../$name.zip" .)
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" -C pkg .
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: rollupdb_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
      FILES: >-
        rollupdb_linux_amd64.tar.gz rollupdb_linux_arm64.tar.gz
        rollupdb_darwin_arm64.tar.gz rollupdb_darwin_amd64.tar.gz
        rollupdb_windows_amd64.zip SHA256SUMS
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          for f in $FILES; do test -f "$f" || { echo "missing $f" >&2; exit 1; }; done
          cat > ../notes.md <<'EOF'
          Ready-built rollupdb binaries. Each archive holds the `rollupdb` command with LICENSE, NOTICE, README.md and THIRD_PARTY_LICENSES.md.

          | System | File |
          |---|---|
          | Linux, x86-64 | rollupdb_linux_amd64.tar.gz |
          | Linux, ARM64 | rollupdb_linux_arm64.tar.gz |
          | macOS, Apple silicon | rollupdb_darwin_arm64.tar.gz |
          | macOS, Intel | rollupdb_darwin_amd64.tar.gz |
          | Windows, x86-64 | rollupdb_windows_amd64.zip |

          The binaries are pure Go with no CGo and need nothing else installed. SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine rollupdb`.
          EOF
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "RollupDB $TAG" --notes-file ../notes.md $FILES
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
