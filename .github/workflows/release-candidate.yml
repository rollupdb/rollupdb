name: Release candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, suffix: "" }
          - { runner: macos-latest, goos: darwin, goarch: arm64, suffix: "" }
          - { runner: windows-latest, goos: windows, goarch: amd64, suffix: ".exe" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies and tests
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go mod verify
          go test ./...
      - name: Build native candidate
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/rollupdb-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/rollupdb
      - name: Smoke test candidate
        shell: bash
        run: |
          cd dist
          binary="./rollupdb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          "$binary" --help
          "$binary" init smoke.rollupdb
          "$binary" inspect smoke.rollupdb
          "$binary" snapshot smoke.rollupdb smoke-copy.rollupdb
          "$binary" inspect smoke-copy.rollupdb
          rm -f smoke.rollupdb smoke-copy.rollupdb
      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          binary="rollupdb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$binary" > "$binary.sha256"
          else
            shasum -a 256 "$binary" > "$binary.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/rollupdb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
            dist/rollupdb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}.sha256
          if-no-files-found: error
          retention-days: 14
