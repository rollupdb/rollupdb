name: record

# Runs scripts/record-tests.sh on GitHub and commits test/results to main.
# Started by hand (or through the API) when the results should be refreshed,
# for example after a release. The commit is made with the repository's own
# token, so it doesn't start the test or release workflows. If any test or
# example fails, nothing is committed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Record
        run: sh scripts/record-tests.sh
      - name: Commit the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/results
          if git diff --cached --quiet; then
            echo "No change in the results."
            exit 0
          fi
          git commit -m "Record test results for $(git rev-parse --short HEAD)"
          git push origin HEAD:main
